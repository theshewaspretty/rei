services:
  infra-scanner:
    build:
      context: .
      args:
        VERSION: ${VERSION:-1.0.0}
    image: infra-scanner:${VERSION:-1.0.0}
    restart: unless-stopped
    ports:
      - "${PUBLISH_PORT:-8443}:8443"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?.env 에 ADMIN_PASSWORD 를 설정하세요}
      ENROLL_TOKEN: ${ENROLL_TOKEN:?.env 에 ENROLL_TOKEN 을 설정하세요}
      TLS_MODE: ${TLS_MODE:-selfsigned}
      TLS_HOSTS: ${TLS_HOSTS:-}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    volumes:
      - infra-data:/data
      # TLS_MODE=files 일 때: 인증서와 키를 읽기 전용으로 넣는다 (uid 65532 가 읽을 수 있어야 한다)
      # - ./certs:/certs:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  infra-data:
